services:
  app_db:
    image: postgres:16
    container_name: cyberforge-app_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cyberforge}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - app_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cyberforge}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_internal

  dvwa_db:
    image: mariadb:10.4
    container_name: cyberforge-dvwa_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: dvwa
      MYSQL_USER: dvwa
      MYSQL_PASSWORD: password
    networks:
      - range_isolated

  dvwa:
    image: vulnerables/web-dvwa
    container_name: cyberforge-dvwa
    restart: always
    init: true
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    ports:
      - "127.0.0.1:8081:80"
    environment:
      DBMS: MySQL
      DB_SERVER: dvwa_db
      DB_DATABASE: dvwa
      DB_USER: dvwa
      DB_PASSWORD: password
    depends_on:
      - dvwa_db
    networks:
      - range_isolated

volumes:
  app_db_data:

networks:
  app_internal:
    driver: bridge
  range_isolated:
    driver: bridge
